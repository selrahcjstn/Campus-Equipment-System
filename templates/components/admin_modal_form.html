<div data-admin-modal-content data-title="{{ page_title }}" data-description="{{ description }}">
    <form method="post" action="{{ request.path }}" class="section-stack" data-admin-modal-form>
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="alert alert--error" role="alert" tabindex="-1">{{ form.non_field_errors }}</div>{% endif %}
        {% for field in form %}{% include "components/input.html" with field=field %}{% endfor %}
        <div class="modal-actions">
            {% if modal_request %}<button type="button" class="button button--secondary" data-admin-form-close>Cancel</button>{% else %}<a class="button button--secondary" href="{% url back_url %}">Cancel</a>{% endif %}
            <button type="submit" class="button button--primary">{{ submit_label }}</button>
        </div>
    </form>
</div>
